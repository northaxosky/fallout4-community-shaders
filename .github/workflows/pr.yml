name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Em-dash sweep (no U+2014 in tracked text)
        shell: bash
        run: |
          set -e
          hits=$(git grep -nP $'\xe2\x80\x94' -- \
            ':(exclude)extern' ':(exclude).local' ':(exclude)*.bin' ':(exclude)*.dds' \
            ':(exclude)*.png' ':(exclude)*.zip' ':(exclude)*.dll' ':(exclude)*.pdb' || true)
          if [ -n "$hits" ]; then
            echo "Em-dash characters (U+2014) found in tracked files:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "No em-dashes."

      - name: Bash syntax check (*.sh)
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "  bash syntax error in $f" >&2
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

      - name: PowerShell parse check (*.ps1)
        shell: pwsh
        run: |
          $files = git ls-files '*.ps1'
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tokens, [ref]$err) | Out-Null
            if ($err.Count -gt 0) {
              Write-Error "Parse errors in $f"
              foreach ($e in $err) { Write-Error "  $($e.Message) at line $($e.Extent.StartLineNumber)" }
              $failed = 1
            }
          }
          exit $failed

  build:
    name: Windows Release
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Fetch submodule LFS assets
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive "git lfs install --local && git lfs pull"

      - name: Resolve vcpkg root
        shell: pwsh
        run: |
          $candidates = @($env:VCPKG_ROOT, $env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg') |
            Where-Object { $_ } |
            Select-Object -Unique

          $root = $null
          foreach ($candidate in $candidates) {
            $toolchain = Join-Path $candidate 'scripts\buildsystems\vcpkg.cmake'
            if (Test-Path $toolchain) {
              $root = $candidate
              break
            }
          }

          if (-not $root) {
            throw "Could not find a vcpkg toolchain. Tried: $($candidates -join ', ')"
          }

          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) {
            throw 'VCPKG_ROOT was not set'
          }
          cmake -S . --preset=default

      - name: Verify shader roundtrip baselines
        shell: pwsh
        run: |
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path $kitsRoot -Filter fxc.exe -Recurse |
            Where-Object { $_.FullName -like '*\x64\fxc.exe' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $fxc) {
            throw "Could not find x64 fxc.exe under $kitsRoot"
          }

          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-shader-roundtrip.ps1 -FxcPath $fxc.FullName

      - name: Build
        run: cmake --build build --config Release --parallel
