name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bash syntax check (*.sh)
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "  bash syntax error in $f" >&2
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

      - name: PowerShell parse check (*.ps1)
        shell: pwsh
        run: |
          $files = git ls-files '*.ps1'
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tokens, [ref]$err) | Out-Null
            if ($err.Count -gt 0) {
              Write-Error "Parse errors in $f"
              foreach ($e in $err) { Write-Error "  $($e.Message) at line $($e.Extent.StartLineNumber)" }
              $failed = 1
            }
          }
          exit $failed

  build:
    name: Windows Release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      package-name: ${{ steps.package-metadata.outputs.package-name }}
      channel: ${{ steps.release-info.outputs.channel }}
      tag: ${{ steps.release-info.outputs.tag }}
      previous-stable-tag: ${{ steps.release-info.outputs.previous-stable-tag }}
      publish: ${{ steps.release-info.outputs.publish }}

    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Stable releases must be dispatched from main.'
          }

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch submodule LFS assets
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive "git lfs install --local && git lfs pull"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Compute release metadata
        id: release-info
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          $arguments = @('release-info', "--output=$env:GITHUB_OUTPUT")
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $arguments += '--dispatch'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $arguments += '--no-publish'
          } elseif ($env:BEFORE) {
            $arguments += "--before=$env:BEFORE"
          }
          xmake @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore SDK archive cache
        if: steps.release-info.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: .sdk-cache
          key: ${{ runner.os }}-sdk-${{ hashFiles('scripts/sdk-manifest.psd1') }}

      - name: Fetch SDK runtimes
        if: steps.release-info.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/fetch-sdks.ps1

      - name: Configure
        env:
          RELEASE_IDENTITY: ${{ steps.release-info.outputs.identity }}
        run: xmake f -m releasedbg -y "--release_identity=$env:RELEASE_IDENTITY"

      - name: Build
        run: xmake -y FO4CommunityShaders

      - name: Run tests
        run: xmake test

      - name: Assemble package
        if: steps.release-info.outputs.publish == 'true'
        run: xmake package FO4CommunityShaders

      - name: Prepare package metadata
        if: steps.release-info.outputs.publish == 'true'
        id: package-metadata
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/packages -File -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected one xmake package archive, found $($archives.Count)"
          }
          $packageName = [System.IO.Path]::GetFileNameWithoutExtension($archives[0].Name)
          "package-name=$packageName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release package
        if: steps.release-info.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-metadata.outputs.package-name }}-archive
          path: build/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package-name }}-archive
          path: dist

      - name: Publish verified archive and prune dev releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          PREVIOUS_STABLE_TAG: ${{ needs.build.outputs.previous-stable-tag }}
          ASSET: ${{ needs.build.outputs.package-name }}.zip
        run: bash scripts/publish-release.sh
