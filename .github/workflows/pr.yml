name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Bash syntax check (*.sh)
        shell: bash
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "  bash syntax error in $f" >&2
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

      - name: PowerShell parse check (*.ps1)
        shell: pwsh
        run: |
          $files = git ls-files '*.ps1'
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tokens, [ref]$err) | Out-Null
            if ($err.Count -gt 0) {
              Write-Error "Parse errors in $f"
              foreach ($e in $err) { Write-Error "  $($e.Message) at line $($e.Extent.StartLineNumber)" }
              $failed = 1
            }
          }
          exit $failed

  build:
    name: Windows Release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      package-name: ${{ steps.package-metadata.outputs.package-name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Fetch submodule LFS assets
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive "git lfs install --local && git lfs pull"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Restore SDK archive cache
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: .sdk-cache
          key: ${{ runner.os }}-sdk-${{ hashFiles('scripts/sdk-manifest.psd1') }}

      - name: Fetch SDK runtimes
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/fetch-sdks.ps1

      - name: Configure
        run: xmake f -m releasedbg -y

      - name: Build
        run: xmake -y FO4CommunityShaders

      - name: Run tests
        run: xmake test

      - name: Assemble package
        if: github.event_name == 'push'
        run: xmake package FO4CommunityShaders

      - name: Prepare package metadata
        if: github.event_name == 'push'
        id: package-metadata
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem build/packages -File -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected one xmake package archive, found $($archives.Count)"
          }
          $packageName = [System.IO.Path]::GetFileNameWithoutExtension($archives[0].Name)
          "package-name=$packageName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-metadata.outputs.package-name }}-archive
          path: build/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.package-name }}-archive
          path: dist

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $archives = @(Get-ChildItem dist -File -Filter '*.zip')
          if ($archives.Count -ne 1) {
            throw "Expected one release archive, found $($archives.Count)"
          }

          $tag = $env:GITHUB_REF_NAME
          $title = "FO4 Community Shaders $tag"
          gh release view $tag 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag $archives[0].FullName --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release archive for $tag"
            }
            gh release edit $tag --prerelease --title $title
          } else {
            gh release create $tag $archives[0].FullName --verify-tag --prerelease --title $title --notes 'Prerelease playtest build.'
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish prerelease for $tag"
          }
