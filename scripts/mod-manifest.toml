[mod]
name = "FO4 Community Shaders"
project_root_marker = "CMakeLists.txt"

[build]
preset = "default"
config = "Release"
build_dir = "build"

[deploy]
mod_dir_var = "MOD_DIR"

[[deploy.dlls]]
src = "build/Release/FO4CommunityShaders.dll"
dst = "F4SE/Plugins/FO4CommunityShaders.dll"
pdb = true

# Upscaling HLSL shaders (committed).
[[deploy.assets]]
src = "package/F4SE/Plugins/Upscaling/"
dst = "F4SE/Plugins/Upscaling/"
pattern = "*.hlsl"

# FrameGeneration HLSL shaders (committed).
[[deploy.assets]]
src = "package/F4SE/Plugins/FrameGeneration/"
dst = "F4SE/Plugins/FrameGeneration/"
pattern = "*.hlsl"

# Screen-Space Shadows HLSL + Bend SSS hlsli.
[[deploy.assets]]
src = "features/ScreenSpaceShadows/Shaders/"
dst = "F4SE/Plugins/ScreenSpaceShadows/"
pattern = "*.hlsl*"

# Screen-Space GI HLSL.
[[deploy.assets]]
src = "features/ScreenSpaceGI/Shaders/"
dst = "F4SE/Plugins/ScreenSpaceGI/"
pattern = "*.hlsl*"

# Imagespace HLSL.
[[deploy.assets]]
src = "features/Imagespace/Shaders/"
dst = "F4SE/Plugins/FO4CommunityShaders/Imagespace/Shaders/"
pattern = "*.hlsl*"

# Default TOML seeds for features that read F4SE/Plugins/FO4CommunityShaders/*.toml.
[[deploy.assets]]
src = "package/F4SE/Plugins/FO4CommunityShaders/"
dst = "F4SE/Plugins/FO4CommunityShaders/"
pattern = "*.toml"

# Imagespace builtin preset TOMLs (5 shipped presets; users add their own under
# F4SE/Plugins/FO4CommunityShaders/Imagespace/Presets/ at runtime).
[[deploy.assets]]
src = "package/F4SE/Plugins/FO4CommunityShaders/Imagespace/Presets/Builtin/"
dst = "F4SE/Plugins/FO4CommunityShaders/Imagespace/Presets/Builtin/"
pattern = "*.toml"

# Imagespace shipped LUT textures (Reactor-Warm.dds; users drop their own *.dds beside these).
[[deploy.assets]]
src = "package/F4SE/Plugins/FO4CommunityShaders/Imagespace/LUTs/"
dst = "F4SE/Plugins/FO4CommunityShaders/Imagespace/LUTs/"
pattern = "*.dds"

# ShaderReplacement manifest (maps runtime PS sha1 to reconstructed HLSL).
[[deploy.assets]]
src = "package/F4SE/Plugins/FO4CommunityShaders/"
dst = "F4SE/Plugins/FO4CommunityShaders/"
pattern = "*.json"

# ShaderReplacement HLSL sources, compiled in-process at OnD3D11Ready via D3DCompileFromFile.
[[deploy.assets]]
src = "shaders/"
dst = "F4SE/Plugins/FO4CommunityShaders/Shaders/"

# NVIDIA Streamline runtime DLLs (fetched by scripts/fetch-sdks.sh).
[[deploy.assets]]
src = "package/F4SE/Plugins/Streamline/"
dst = "F4SE/Plugins/Streamline/"
pattern = "*.dll"

# AMD FidelityFX runtime DLL (fetched by scripts/fetch-sdks.sh).
[[deploy.assets]]
src = "package/F4SE/Plugins/FrameGeneration/FidelityFX/"
dst = "F4SE/Plugins/FrameGeneration/FidelityFX/"
pattern = "*.dll"

# Intel XeSS runtime DLLs (copied from extern/XeSS/bin by scripts/fetch-sdks.sh).
[[deploy.assets]]
src = "package/F4SE/Plugins/FrameGeneration/XeSS/"
dst = "F4SE/Plugins/FrameGeneration/XeSS/"
pattern = "*.dll"

[launch]
mo2_exe_var = "MO2_EXE"
mo2_profile_var = "MO2_PROFILE"
mo2_executable_var = "MO2_EXECUTABLE"
process_name = "Fallout4.exe"

[test]
log_dir_var = "F4SE_LOG_DIR"

[[test.logs]]
name = "FO4CommunityShaders.log"
copy_to_results = true

[test.success_markers]
data_loaded = '\[cs\] FO4CommunityShaders v.*loaded'
rendering_active = '\[cs\.menu\] ImGui initialized'

[test.timeouts]
launch_seconds = 30
data_loaded_seconds = 60
post_load_idle_seconds = 30
stabilize_seconds = 10
overall_seconds = 120
