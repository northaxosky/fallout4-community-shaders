[feature]
load = false

[settings]
# Master toggle. Ships off in v1; user opts in via the in-game settings menu.
enabled = false

# Writer thread flush cadence. Lower = more responsive UI counter, higher = less
# SQLite work. 5000ms is a good default.
writer_flush_interval_ms = 5000

# Where to write the catalog file. Path is relative to the FO4 install dir.
catalog_path = "Data\\F4SE\\Plugins\\FO4CommunityShaders\\shader-catalog.sqlite"

# BSShader subclass technique attribution (enriches PS rows with subclass/technique names).
# Auto-skipped on runtimes with an unverified BSShader layout (e.g. next-gen 1.11.x) to avoid a
# crash; the device swap broker and catalog stay fully functional when it's skipped.
subclass_attribution = true
