[meta]
name = "Cinematic-Night"
created_by = "FO4CommunityShaders Imagespace"
description = "Low-key cinematic look biased toward night scenes: Hable tonemap, soft diffused bloom with weight on higher mips, strong vignette, gentle CA, DOF on (50mm, 1500u focus). Clear weather gets a touch more bloom for moonlight rim."

[settings]
enabled = true
style = 0
force_with_enb = false

tonemap_operator = 1
exposure = 1.0
lut_enable = false
lut_path = ""
lut_strength = 1.0

adaptive_exposure = true
adaptation_speed_up = 0.4
adaptation_speed_down = 1.5
exposure_key = 0.16
exposure_min = 0.05
exposure_max = 4.0

bloom_enable = true
bloom_threshold = 0.80
bloom_intensity = 0.07
bloom_mips = 5
bloom_mip_weights = [0.4, 0.7, 1.0, 1.3, 1.5, 1.5]

vignette_enable = true
vignette_intensity = 0.5
ca_enable = true
ca_intensity = 0.6
sharpen_enable = false
sharpness = 0.0

sunsprite_enable = true
sunsprite_intensity = 0.4
sunsprite_size = 0.05
lens_flare_enable = false
lens_flare_intensity = 0.6
lens_flare_ghosts = 5
dirt_enable = false
dirt_intensity = 0.0

dof_enable = true
aperture = 0.05
focus_distance = 1500.0
focal_length = 50.0
focus_range = 200.0
dof_quality = 1
coc_limit_factor = 0.04
bokeh_intensity = 0.0
anamorph_ratio = 1.0

[weather]
enable_per_weather_profiles = true

[weather.clear]
bloom_intensity = 0.08
