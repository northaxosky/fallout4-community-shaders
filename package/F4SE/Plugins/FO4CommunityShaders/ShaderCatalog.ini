[Settings]
; Master toggle. Ships off in v1; user opts in via the in-game settings menu.
bEnabled = false

; Writer thread flush cadence. Lower = more responsive UI counter, higher = less
; SQLite work. 5000ms is a good default.
iWriterFlushIntervalMs = 5000

; Where to write the catalog file. Path is relative to the FO4 install dir.
sCatalogPath = Data\F4SE\Plugins\FO4CommunityShaders\shader-catalog.sqlite

; Symbolication budget. If a stack walk takes longer than this many microseconds,
; drop the frames for that entry. Tunable knob; the hot path itself just calls
; CaptureStackBackTrace which is fast, but the writer-side symbolication may
; need this cap on machines with many loaded modules.
iSymbolicationBudgetUs = 200
