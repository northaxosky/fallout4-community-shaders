[info]
schema_version = 1

[logging]
level = "info"
telemetry = false
telemetry_interval_seconds = 5
dump_hotkey = "Ctrl+F12"
# Requires restart; set the cs.render.prepass channel to debug for per-draw output.
prepass_technique_instrumentation = false

[logging.channels]

[shader_ownership]
enabled = false

[shader_ownership.targets]
deferred_prepass = true
bssky = true
bswater = true
bslighting = true
bsdf_light = true
bsdf_composite = true
df_tiled_lighting = true
# Deferred composite lacks native proof; it and VLS lack selectable stock SHA-1 guards.

[menu]
developer_mode = false
first_time_setup_completed = false
auto_hide_feature_list = false
require_shift_to_dock = true
use_resolution_font = true
selected_theme_preset = ""
debug_view_feature = ""
debug_view = ""
debug_view_previews = {}
# Virtual-key codes; an array records a modifier combination.
toggle_key = 35
overlay_toggle_key = 121

[preset]
active = ""
auto_load_on_boot = false

[features.ScreenSpaceGI]
load = false

[features.ScreenSpaceGI.settings]
# Runtime toggle for the injected composition. The feature itself ships off above.
enabled = true

# XeGTAO quality.
num_slices = 4
num_steps = 8

# Sweep radii (game units). The larger radius drives the screen-space sweep.
ao_radius = 256.0
gi_radius = 256.0

ao_power = 1.0
bounce_strength = 1.0

# Denoise.
denoise_enabled = true
denoise_radius = 2.0

# Temporal reprojection of the indirect bounce.
enable_temporal_denoiser = true
depth_disocclusion = 0.1
max_accum_frames = 16

# Distance fade (game units).
depth_fade_start = 40000.0
depth_fade_end = 50000.0

[features.InverseSquareLighting]
load = false

[features.InverseSquareLighting.settings]
# Runtime toggle for the deferred punctual-light attenuation blend.
enabled = true
# Upstream applies its full effect to every opted-in light.
exterior_strength = 1.0
# The location split ships neutral; lower this only if authored interiors read too hot.
interior_strength = 1.0
# Upstream's default size sqrt(2) maps to sqrt(3920) game units.
near_field_distance = 62.6099034

[features.DynamicCubemaps]
load = false

[features.DynamicCubemaps.settings]
# Runtime toggle for capture and deferred-composite consumption.
enabled = true

[features.WetnessEffects]
load = false

[features.WetnessEffects.settings]
# Runtime toggle for the published wetness. The feature itself ships off above.
enabled = true
max_rain_wetness = 1.0
min_rain_wetness = 0.65

[features.WaterEffects]
load = false

[features.WaterEffects.settings]
# Runtime toggle for the caustics multiply. Upstream ships no other tunables.
enabled = true

[features.ScreenSpaceShadows]
load = false

[features.ScreenSpaceShadows.settings]
enabled = true
sample_count = 1
surface_thickness = 0.02
bilinear_threshold = 0.02
shadow_contrast = 1.0

[features.TerrainShadows]
load = false

[features.TerrainShadows.settings]
# Runtime toggle for the published terrain shadow. The feature itself ships off above.
enabled = true

# Heightmap resolution divisor. Factor 4 uses one-sixteenth the factor 1 VRAM.
downsample_factor = 4

[features.MotionVectorFixes]
load = false

[features.Upscaling]
load = false

[features.Upscaling.settings]
# Runtime toggle for the resolve. The feature itself ships off above.
enabled = true

# 0 = None, 1 = TAA, 2 = FSR 3, 3 = DLSS. The second key is used when DLSS is unavailable.
upscale_method = 3
upscale_method_no_dlss = 2

# 0 = Native AA, 1 = Quality, 2 = Balanced, 3 = Performance, 4 = Ultra Performance.
quality_mode = 1

# AMD FSR 3 frame generation uses a startup-only D3D12 proxy independently of the selected upscaler.
frame_generation_mode = 1
# Allow proxy startup below 120 Hz. Changing either startup setting requires a game restart.
frame_generation_force_enable = 0
# Generated frames are disabled in pause, main, loading, and Pip-Boy menus by default.
frame_generation_allow_in_menus = false

# 0 = Default, 1 = J, 2 = K, 3 = L, 4 = M.
preset_dlss = 0

sharpness_fsr = 0.0
sharpness_enabled_dlss = false
sharpness_dlss = 0.0

# 0 = Off, 1 = Default, 2 = Verbose. Applied when Streamline initializes at start-up.
streamline_log_level = 0

[features.PerformanceOverlay]
load = false
[features.PerformanceOverlay.settings]
# In-game overlay toggle chord (e.g. "F10", "Shift+F11", "Ctrl+F9"); "none" unbinds it.
toggle_hotkey = "F10"

[features.RenderDoc]
load = false

[features.RenderDoc.settings]
# Capture output folder. Default (unset): <Documents>\My Games\Fallout4\F4SE\FO4CommunityShaders\captures
# (beside the F4SE log, outside the MO2 virtual file system). Environment variables are expanded.
# capture_folder = "%USERPROFILE%\\Documents\\My Games\\Fallout4\\F4SE\\FO4CommunityShaders\\captures"
# Single-frame capture chord; "none" unbinds it.
capture_hotkey = "F11"
# Multi-frame capture chord; takes precedence if identical to capture_hotkey.
multi_capture_hotkey = "Shift+F11"
