[info]
schema_version = 1

[logging]
level = "info"
telemetry = false
telemetry_interval_frames = 60
dump_hotkey = "Ctrl+F12"

[logging.channels]

[shader_ownership]
enabled = false

[shader_ownership.targets]
deferred_prepass = true
bssky = true
bswater = true
bslighting = true
bsdf_light = true
bsdf_composite = true
# Deferred composite lacks native proof; it and VLS lack selectable stock SHA-1 guards.

[menu]
developer_mode = false

[preset]
active = ""
auto_load_on_boot = false

[features.ScreenSpaceGI]
load = false

[features.ScreenSpaceGI.settings]
# Runtime toggle for the injected composition. The feature itself ships off above.
enabled = true

# XeGTAO quality.
num_slices = 4
num_steps = 8

# Sweep radii (game units). The larger radius drives the screen-space sweep.
ao_radius = 256.0
gi_radius = 256.0

ao_power = 1.0
bounce_strength = 1.0

# Denoise.
denoise_enabled = true
denoise_radius = 2.0

# Temporal reprojection of the indirect bounce.
enable_temporal_denoiser = true
depth_disocclusion = 0.1
max_accum_frames = 16

# Distance fade (game units).
depth_fade_start = 40000.0
depth_fade_end = 50000.0

[features.WetnessEffects]
load = false

[features.WetnessEffects.settings]
# Runtime toggle for the published wetness. The feature itself ships off above.
enabled = true
max_rain_wetness = 1.0
min_rain_wetness = 0.65

[features.ScreenSpaceShadows]
load = false

[features.ScreenSpaceShadows.settings]
enabled = true
sample_count = 1
surface_thickness = 0.02
bilinear_threshold = 0.02
shadow_contrast = 1.0

[features.Upscaling]
load = false

[features.Upscaling.settings]

[features.FrameGeneration]
load = false

[features.FrameGeneration.settings]

[features.MotionVectorFixes]
load = false

[features.PerformanceOverlay]
load = false

[features.PerformanceOverlay.settings]
# In-game overlay toggle chord (e.g. "F10", "Shift+F11", "Ctrl+F9"); "none" unbinds it.
toggle_hotkey = "F10"

[features.RenderDoc]
load = false

[features.RenderDoc.settings]
# Capture output folder. Default (unset): <Documents>\My Games\Fallout4\F4SE\FO4CommunityShaders\captures
# (beside the F4SE log, outside the MO2 virtual file system). Environment variables are expanded.
# capture_folder = "%USERPROFILE%\\Documents\\My Games\\Fallout4\\F4SE\\FO4CommunityShaders\\captures"
# Single-frame capture chord; "none" unbinds it.
capture_hotkey = "F11"
# Multi-frame capture chord; takes precedence if identical to capture_hotkey.
multi_capture_hotkey = "Shift+F11"
