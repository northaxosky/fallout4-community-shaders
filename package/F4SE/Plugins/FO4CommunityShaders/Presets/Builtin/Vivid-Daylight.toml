[meta]
name = "Vivid-Daylight"
schema_version = 1
created_by = "FO4CommunityShaders"
description = "Punchy daylight grade. Hable tonemap (operator 1), brighter bloom, lighter vignette, moderate CA, stronger sharpen. SSS Quality on, SSGI Quality on; both apply-to-scene off so the suite stays additive."

[features.imagespace.settings]
enabled = true
style = 0
force_with_enb = false
tonemap_operator = 1
exposure = 1.0
lut_enable = true
lut_path = "Reactor-Warm"
lut_strength = 0.35
adaptive_exposure = true
adaptation_speed_up = 0.5
adaptation_speed_down = 2.0
exposure_key = 0.2
exposure_min = 0.05
exposure_max = 4.0
bloom_enable = true
bloom_threshold = 0.85
bloom_intensity = 0.06
bloom_mips = 5
bloom_mip_weights = [1.0, 1.1, 1.2, 1.1, 1.0, 1.0]
vignette_enable = true
vignette_intensity = 0.15
ca_enable = true
ca_intensity = 0.4
sharpen_enable = true
sharpness = 0.6
sunsprite_enable = true
sunsprite_intensity = 0.7
sunsprite_size = 0.05
lens_flare_enable = true
lens_flare_intensity = 0.6
lens_flare_ghosts = 5
dirt_enable = false
dirt_intensity = 0.0
dof_enable = false
aperture = 0.05
focus_distance = 1500.0
focal_length = 50.0
focus_range = 200.0
dof_quality = 1
coc_limit_factor = 0.04
bokeh_intensity = 0.0
anamorph_ratio = 1.0

[features.imagespace.weather]
enable_per_weather_profiles = true

[features.imagespace.weather.clear]
lut_strength = 0.4
bloom_intensity = 0.065

[features.imagespace.weather.rain]
lut_strength = 0.15

[features.screen_space_shadows.settings]
enabled = true
preset = 2
sample_count = 2
surface_thickness = 0.02
bilinear_threshold = 0.02
shadow_contrast = 1.1
apply_to_scene = false
sun_only = true
apply_contrast = 1.0

[features.screen_space_gi.settings]
enabled = true
preset = 2
slice_count = 4
step_count = 8
ao_radius = 220.0
ao_power = 1.3
thickness = 32.0
apply_ao_to_scene = false
apply_intensity = 0.55
apply_contrast = 1.0
resolution_mode = 1
enable_gi = true
gi_radius = 256.0
gi_strength = 1.0
gi_saturation = 0.85
gi_distance_compensation = 0.0
enable_temporal_denoiser = true
enable_blur = true
