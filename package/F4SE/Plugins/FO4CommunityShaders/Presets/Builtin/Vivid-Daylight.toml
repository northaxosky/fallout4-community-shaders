[meta]
name = "Vivid-Daylight"
schema_version = 1
created_by = "FO4CommunityShaders"
description = "Punchy daylight grade. Hable tonemap (operator 1), brighter bloom, lighter vignette, moderate CA, stronger sharpen."

[features.imagespace.settings]
enabled = true
style = 0
tonemap_operator = 1
exposure = 1.0
lut_enable = true
lut_path = "Reactor-Warm"
lut_strength = 0.35
adaptive_exposure = true
adaptation_speed_up = 0.5
adaptation_speed_down = 2.0
exposure_key = 0.2
exposure_min = 0.05
exposure_max = 4.0
bloom_enable = true
bloom_threshold = 0.85
bloom_intensity = 0.06
bloom_mips = 5
bloom_mip_weights = [1.0, 1.1, 1.2, 1.1, 1.0, 1.0]
vignette_enable = true
vignette_intensity = 0.15
ca_enable = true
ca_intensity = 0.4
sharpen_enable = true
sharpness = 0.6
lens_flare_enable = true
lens_flare_intensity = 0.6
lens_flare_ghosts = 5
dirt_enable = false
dirt_intensity = 0.0
dof_enable = false
aperture = 0.05
focus_distance = 1500.0
focal_length = 50.0
focus_range = 200.0
dof_quality = 1
coc_limit_factor = 0.04
bokeh_intensity = 0.0
anamorph_ratio = 1.0

[features.imagespace.weather]
enable_per_weather_profiles = true

[features.imagespace.weather.clear]
lut_strength = 0.4
bloom_intensity = 0.065

[features.imagespace.weather.rain]
lut_strength = 0.15
