[meta]
name = "Reactor-Inspired"
schema_version = 1
created_by = "FO4CommunityShaders"
description = "Evokes the warm-midtone, gentle-S-curve character of Reactor ENB. Ships the Reactor-Warm 32x32x32 LUT at full strength on clear weather and scales back in storms. Hable tonemap, soft-leaning bloom, lens flare on, dirt off."

[features.imagespace.settings]
enabled = true
style = 0
tonemap_operator = 1
exposure = 1.05
lut_enable = true
lut_path = "Reactor-Warm"
lut_strength = 1.0
adaptive_exposure = true
adaptation_speed_up = 0.5
adaptation_speed_down = 2.0
exposure_key = 0.18
exposure_min = 0.05
exposure_max = 4.0
bloom_enable = true
bloom_threshold = 0.85
bloom_intensity = 0.05
bloom_mips = 5
bloom_mip_weights = [0.6, 0.8, 1.0, 1.2, 1.4, 1.4]
vignette_enable = true
vignette_intensity = 0.4
ca_enable = true
ca_intensity = 0.3
sharpen_enable = true
sharpness = 0.5
lens_flare_enable = true
lens_flare_intensity = 0.4
lens_flare_ghosts = 5
dirt_enable = false
dirt_intensity = 0.0
dof_enable = false
aperture = 0.05
focus_distance = 1500.0
focal_length = 50.0
focus_range = 200.0
dof_quality = 1
coc_limit_factor = 0.04
bokeh_intensity = 0.0
anamorph_ratio = 1.0

[features.imagespace.weather]
enable_per_weather_profiles = true

[features.imagespace.weather.clear]
lut_strength = 1.0
bloom_intensity = 0.055

[features.imagespace.weather.rain]
lut_strength = 0.6
vignette_intensity = 0.5

[features.imagespace.weather.overcast]
lut_strength = 0.7

[features.imagespace.weather.snow]
lut_strength = 0.4
vignette_intensity = 0.45

[features.imagespace.weather.fog]
lut_strength = 0.5
bloom_intensity = 0.045
